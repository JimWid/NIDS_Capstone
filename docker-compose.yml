services:

  # ---------------------------------------------------------------
  # Database: uses a pre-built image, so no Dockerfile needed
  # ---------------------------------------------------------------
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data              # data survives restarts
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro  # schema, runs on first start only
    ports:
      - "5432:5432"                                  # handy for DBeaver/psql; remove if not needed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------
  # Backend: FastAPI, serves alerts/stats to the dashboard
  # ---------------------------------------------------------------
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy                   # wait until Postgres is actually ready
    ports:
      - "8000:8000"                                  # API docs at http://localhost:8000/docs

  # ---------------------------------------------------------------
  # Detection: capture/replay -> features -> model -> alerts -> DB
  # ---------------------------------------------------------------
  detection:
    build: ./detection
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DETECTION_MODE: ${DETECTION_MODE:-replay}      # replay (default) or live
      PCAP_PATH: ${PCAP_PATH:-/data/sample.pcap}
      MODEL_PATH: /models/model.joblib
    volumes:
      - ./data:/data:ro                              # pcaps / datasets (gitignored)
      - ./ml/models:/models:ro                       # trained model from ml/train.py
    depends_on:
      db:
        condition: service_healthy

    # --- Live sniffing (Linux host or Linux VM only) ---
    # Uncomment these two lines and set DETECTION_MODE=live in .env.
    # On Mac/Windows this will NOT see your real network (Docker runs in a hidden VM).
    # network_mode: host
    # cap_add: [NET_ADMIN, NET_RAW]

  # ---------------------------------------------------------------
  # Frontend: dashboard (Next.js or static HTML + Chart.js)
  # ---------------------------------------------------------------
  frontend:
    build: ./frontend
    environment:
      # Called from the user's BROWSER, so this must be localhost, not "backend"
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"                                  # dashboard at http://localhost:3000

volumes:
  pgdata: